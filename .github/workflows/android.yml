name: Build EuroRaptor APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Install Android SDK 35
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Run automated unit tests
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build-diagnostics
          gradle --no-daemon testDebugUnitTest 2>&1 | tee build-diagnostics/unit-tests.log
      - name: Publish readable test summary
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import glob, os, xml.etree.ElementTree as ET
          files=glob.glob('app/build/test-results/testDebugUnitTest/TEST-*.xml')
          groups={}
          for path in files:
              root=ET.parse(path).getroot()
              name=root.attrib.get('name',os.path.basename(path))
              tests=root.findall('.//testcase')
              failed=[t for t in tests if t.find('failure') is not None or t.find('error') is not None]
              skipped=[t for t in tests if t.find('skipped') is not None]
              groups[name]=(len(tests),failed,skipped)
          total=sum(v[0] for v in groups.values())
          failures=sum(len(v[1]) for v in groups.values())
          skipped=sum(len(v[2]) for v in groups.values())
          passed=total-failures-skipped
          lines=['# EuroRaptor – automatische testresultaten','',
                 f'**{passed} van {total} tests geslaagd** · {failures} mislukt · {skipped} overgeslagen','']
          if not files:
              lines+=['⚠️ Geen JUnit-resultaten gevonden. De tests zijn mogelijk niet gestart.','']
          else:
              lines+=['| Testgroep | Geslaagd | Totaal | Mislukt |','|---|---:|---:|---:|']
              for name,(n,bad,skip) in sorted(groups.items()):
                  lines.append(f'| {name.split(".")[-1]} | {n-len(bad)-len(skip)} | {n} | {len(bad)} |')
              lines.append('')
              for name,(n,bad,skip) in sorted(groups.items()):
                  for test in bad:
                      lines.append(f'- ❌ {name.split(".")[-1]}.{test.attrib.get("name","?")}')
                      detail=test.find('failure')
                      if detail is None:
                          detail=test.find('error')
                      if detail is not None:
                          message=(detail.attrib.get('message') or detail.text or '').strip()
                          if message:
                              lines.append('')
                              lines.append('    ' + message[:3000].replace('\\n','\\n    '))
              for path in files:
                  root=ET.parse(path).getroot()
                  if root.attrib.get('name','').endswith('SpeedBadgeScreenshotTest'):
                      for tag in ('system-out','system-err'):
                          output=root.findtext(tag)
                          if output:
                              lines.append('')
                              lines.append('### Screenshot diagnostics (' + tag + ')')
                              lines.append('```')
                              lines.append(output[-6000:])
                              lines.append('```')
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as out:
              out.write('\\n'.join(lines)+'\\n')
          print('\\n'.join(lines))
          PY
      - name: Upload detailed test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: EuroRaptor-test-results
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
          if-no-files-found: warn
      - name: Build debug APK
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build-diagnostics
          gradle --no-daemon assembleDebug 2>&1 | tee build-diagnostics/apk-build.log
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: EuroRaptor-build-diagnostics
          path: build-diagnostics/
          if-no-files-found: warn
          retention-days: 30
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EuroRaptor-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
